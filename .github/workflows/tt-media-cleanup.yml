name: tt-media cleanup
# TikTok投稿用の動画の一時置き場（tt-media/ で始まるブランチ）を片づける。
# 最後の更新から24時間たったブランチだけを消す。ほかのブランチには触らない。
on:
  schedule:
    - cron: '17 18 * * *'   # 毎日 03:17（日本時間）
  workflow_dispatch:         # 手動でも動かせる
permissions:
  contents: write
jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Delete tt-media branches older than 24h
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          now=$(date -u +%s)
          gh api "repos/${REPO}/git/matching-refs/heads/tt-media/" \
            --jq '.[] | "\(.ref) \(.object.sha)"' | while read -r ref sha; do
            case "$ref" in refs/heads/tt-media/*) ;; *) continue ;; esac
            d=$(gh api "repos/${REPO}/git/commits/${sha}" --jq '.committer.date')
            age=$(( now - $(date -u -d "$d" +%s) ))
            if [ "$age" -gt 86400 ]; then
              gh api -X DELETE "repos/${REPO}/git/${ref}"
              echo "deleted ${ref}"
            else
              echo "keep ${ref} (${age}s)"
            fi
          done
